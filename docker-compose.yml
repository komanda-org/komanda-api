services:
  postgres:
    image: postgres:16
    container_name: komanda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: komanda
      POSTGRES_PASSWORD: komanda123
      POSTGRES_DB: komanda_db
    ports:
      - '5432:5432'
    volumes:
      - komanda_postgres_data:/var/lib/postgresql/data

volumes:
  komanda_postgres_data: